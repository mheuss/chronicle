# Lives at the repo root on purpose. Cargo finds config by walking up from the
# directory it is invoked in and does not follow --manifest-path, so a file
# under chronicle-daemon/ was invisible to any build started from the root
# (CHR-130). From here it applies anywhere inside the repo.

# ScreenCaptureKit depends on libswift_Concurrency.dylib, which is referenced
# via @rpath. Without an rpath the binary (and test binaries) crash at launch
# with "no LC_RPATH's found". The library lives in the dyld shared cache at
# /usr/lib/swift.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

# audiopus_sys 0.2.2 vendors an Opus tree whose CMakeLists.txt declares
# cmake_minimum_required(VERSION 3.1). CMake 4 removed support for minimums
# below 3.5, so configure aborts and no build — debug or release — gets past
# it. The crate is unmaintained (RUSTSEC-2026-0150), so no upstream fix is
# coming; CHR-55 tracks moving off it.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# Chronicle.app runs on any Apple Silicon Mac with macOS 14 or later (CHR-75).
# Without these, whisper.cpp builds for the host SDK's macOS version and with
# -mcpu=native, which emits i8mm instructions an M1 cannot run.
# whisper-rs-sys forwards only WHISPER_* and CMAKE_* variables to CMake, so
# GGML_NATIVE cannot be set directly. A set CMAKE_SYSTEM_NAME makes CMake treat
# the build as a cross-compile, and ggml turns GGML_NATIVE off for those.
# Both apply to every build, so dev builds run what ships. force = true keeps
# an exported MACOSX_DEPLOYMENT_TARGET from overriding them.
# whisper-rs-sys does not rebuild when these change, and an existing CMake cache
# keeps GGML_NATIVE=ON. After changing them, run `cargo clean -p whisper-rs-sys`
# for each profile.
MACOSX_DEPLOYMENT_TARGET = { value = "14.0", force = true }
CMAKE_SYSTEM_NAME = { value = "Darwin", force = true }
