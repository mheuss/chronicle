[package]
name = "chronicle-transcription"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Whisper.cpp transcription engine + Opus decode for captured audio"
license = "MIT"

[dependencies]
whisper-rs = { version = "0.14", default-features = false }
opus = "0.3"
ogg = "0.9"
log = "0.4"
thiserror = "2"
sha1 = "0.10"
# CHR-173 spike only.
sherpa-onnx = { version = "2.0.2", optional = true }

[features]
default = ["metal"]
metal = ["whisper-rs/metal"]
cpu = []
parakeet = ["dep:sherpa-onnx"]

[dev-dependencies]
# data_root, so the real-model tests and the example find models where the daemon puts them.
chronicle-storage = { path = "../storage" }
tempfile = "3"
chronicle-audio = { path = "../audio" }
# WAV reader for examples/transcribe_wav.rs. Examples see dev-dependencies.
hound = "3.5"

[[example]]
name = "transcribe_wav"
test = true
