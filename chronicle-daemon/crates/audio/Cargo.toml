[package]
name = "chronicle-audio"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Audio encoding pipeline — system audio via ScreenCaptureKit, microphone via AVAudioEngine"
license = "MIT"

[dependencies]
objc2 = "0.6"
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "objc2-core-media",
    "dispatch2",
] }
objc2-avf-audio = { version = "0.3", features = [
    "AVAudioEngine",
    "AVAudioNode",
    "AVAudioIONode",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTime",
    "AVAudioTypes",
    "AVAudioConverter",
    "block2",
] }
block2 = "0.6"
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMBase",
] }
objc2-core-foundation = "0.3"
log = "0.4"
dispatch2 = "0.3"
opus = "0.3"
ogg = "0.9"
thiserror = "2"
# WAV writer for the characterization capture. Optional: only the
# `characterize` feature pulls it in, so production builds never compile it.
hound = { version = "3.5", optional = true }

[features]
# Record what the microphone tap receives and what the converter produces, as
# WAV files, for offline analysis (HEU-650, ADR-013). Off by default.
characterize = ["dep:hound"]

[dev-dependencies]
tempfile = "3"
trybuild = "1"

[[example]]
name = "characterize_mic"
required-features = ["characterize"]
test = true
