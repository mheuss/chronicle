[package]
name = "chronicle-audio"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Audio encoding pipeline — system audio via ScreenCaptureKit, microphone via AVAudioEngine"
license = "MIT"

[dependencies]
objc2 = "0.6"
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "objc2-core-media",
    "dispatch2",
] }
objc2-avf-audio = { version = "0.3", features = [
    "AVAudioEngine",
    "AVAudioNode",
    "AVAudioIONode",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTime",
    "AVAudioTypes",
    "AVAudioConverter",
    "block2",
    "objc2-audio-toolbox",
] }
block2 = "0.6"
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMBase",
] }
objc2-core-foundation = "0.3"
objc2-audio-toolbox = { version = "0.3", default-features = false, features = [
    "AUAudioUnit",
] }
objc2-core-audio = { version = "0.3", default-features = false, features = [
    "AudioHardware",
] }
log = "0.4"
dispatch2 = "0.3"
opus = "0.3"
ogg = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
trybuild = "1"
