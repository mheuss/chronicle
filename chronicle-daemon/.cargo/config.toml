# ScreenCaptureKit depends on libswift_Concurrency.dylib, which is referenced
# via @rpath. Without an rpath the binary (and test binaries) crash at launch
# with "no LC_RPATH's found". The library lives in the dyld shared cache at
# /usr/lib/swift.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

# audiopus_sys 0.2.2 vendors an Opus tree whose CMakeLists.txt declares
# cmake_minimum_required(VERSION 3.1). CMake 4 removed support for minimums
# below 3.5, so configure aborts and no build — debug or release — gets past
# it. The crate is unmaintained (RUSTSEC-2026-0150), so no upstream fix is
# coming; HEU-500 tracks moving off it.
#
# This applies only when cargo runs from this directory, since cargo discovers
# config relative to the invocation cwd. That is what the README documents and
# it is the only path that also picks up the rustflags above.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
