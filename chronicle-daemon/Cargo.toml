[workspace]
members = [
    ".",
    "crates/capture",
    "crates/ocr",
    "crates/audio",
    "crates/transcription",
    "crates/storage",
    "crates/ipc",
]
resolver = "2"

[workspace.package]
rust-version = "1.88"

[package]
name = "chronicle-daemon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Background daemon for Chronicle — continuous screen and audio capture with full-text search"
license = "MIT"

[dependencies]
chronicle-capture = { path = "crates/capture" }
chronicle-ocr = { path = "crates/ocr" }
chronicle-audio = { path = "crates/audio" }
chronicle-storage = { path = "crates/storage" }
chronicle-ipc = { path = "crates/ipc" }
chronicle-transcription = { path = "crates/transcription", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1"
# objc2 + NSString for the AVCaptureDevice permission check in permissions.rs.
# NSWorkspace / CFRunLoop / block2 were dropped when the power observer
# switched from NSWorkspace to raw IOKit FFI (power.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
thiserror = "2"
arc-swap = "1"
async-trait = "0.1"
# rustls only — no native-tls, so there is no plaintext or system-trust
# fallback path for model downloads. default-features off also drops
# macos-system-configuration, so system proxy settings are not consulted.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# statvfs for the pre-download free-space check.
libc = "0.2"

[features]
default = ["transcription-metal"]
transcription-metal = ["chronicle-transcription/metal"]
transcription-cpu = ["chronicle-transcription/cpu"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
opus = "0.3"
# test-util unlocks tokio::time::pause/advance for the StartRetry policy tests.
# net + io-util back the hand-rolled HTTP fixture in provisioning tests. They
# already arrive via chronicle-ipc, but naming them here keeps our tests from
# depending on another crate's feature choices.
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
# The downloader tests compute digests in-test rather than hardcoding them.
# chronicle-transcription's sha1 is a private transitive dep, not importable.
sha1 = "0.10"
