name: Domain map

# Check 8 rebuilds the inventory from the repo instead of trusting
# INVENTORY.txt, so a source file nobody classified fails here. falsify.sh
# breaks each check in turn and requires it to fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placement tests (check 3)
        run: bash docs/domains/checks/check3_placement_tests.sh docs/domains .

      - name: Citations resolve (check 4)
        run: bash docs/domains/checks/check4_citations.sh docs/domains .

      - name: Inventory coverage (check 8)
        run: bash docs/domains/checks/check8_coverage.sh docs/domains .

      - name: Falsification harness
        run: bash docs/domains/checks/falsify.sh
